name: Restore check

# Card 04.2 (monthly) and 04.4 (the timed restore that is the Phase 04 gate): restore each
# tenant's LATEST backup from R2 into an ephemeral Supabase on the runner and compare row
# counts against what the dump wrote. A backup that was never restored is not a backup.
#
# The target is a bare supabase/postgres container of the tenant's major (`major` below,
# checked again against the dump's manifest): `supabase start` with every service but the
# database excluded. Its auth and storage schemas are replaced by production's own DDL
# (platform.sql in the archive) — not by a local GoTrue and Storage, because the platform
# runs versions newer than any the CLI ships, and the first real check (24/09/2026) failed
# on four auth tables GoTrue v2.196.0 does not create. The restore connects as the local
# superuser: the target is thrown away with the runner, and it has to drop and recreate
# schemas the `postgres` role does not own.
#
# Same public-log rules as pg_dump_r2.yml: the archive is decrypted only on the runner,
# nothing is uploaded, a restore error prints its SQLSTATE and never the row, and a count
# mismatch names the table and never a number. The duration is the point of the log.

on:
  schedule:
    # The 3rd of every month, 06:43 UTC — after that day's backup (05:17), off the hour.
    - cron: "43 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-check
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `major` = the production project's Postgres major, measured 24/09/2026
          # (`show server_version` = 17.6 on both). A project upgrade moves it here.
          - tenant: entrelares
            secret: ENTRELARES
            major: 17
          - tenant: gestaoim360
            secret: GESTAOIM360
            major: 17
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start a bare supabase/postgres, Postgres ${{ matrix.major }}
        run: |
          started=$(date -u +%s)
          mkdir -p "$RUNNER_TEMP/target" && cd "$RUNNER_TEMP/target"
          supabase init --force < /dev/null > /dev/null
          sed -i -E 's/^major_version = .*/major_version = ${{ matrix.major }}/' supabase/config.toml
          # The database and nothing else — auth and storage come from platform.sql.
          supabase start -x gotrue,storage-api,studio,postgres-meta,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgrest,kong > /dev/null
          eval "$(supabase status -o env | grep '^DB_URL=')"
          # The same local URL with the stack's superuser in place of `postgres`.
          echo "TARGET_DB_URL=${DB_URL/\/\/postgres:/\/\/supabase_admin:}" >> "$GITHUB_ENV"
          echo "target up in $(( $(date -u +%s) - started ))s"

      - name: Restore and compare — ${{ matrix.tenant }}
        env:
          TENANT: ${{ matrix.tenant }}
          BACKUP_PASSPHRASE: ${{ secrets[format('FULCRUM_BACKUP_{0}_PASSPHRASE', matrix.secret)] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FULCRUM_BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FULCRUM_BACKUP_R2_SECRET_ACCESS_KEY }}
        run: |
          {
            echo "## Restore check — $TENANT"
            echo "| tenant | result | duration | size | dump taken | phases |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          bash backup/restore_check.sh
