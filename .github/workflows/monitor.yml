name: Monitor

# Card 08.1 — the external watch on the three production gateways.
#
# Whoever watches stays outside the thing watched: GitHub is not Cloudflare, so a Cloudflare
# outage is seen from here (Decisions §3). Every 5 minutes (GitHub's minimum; the scheduler
# sometimes runs a few minutes late — what counts is "no red run", not "a run every 5:00"):
#   · `/health` on the three production hosts, with the `tenant` it answers checked — the
#     Worker is up and serving THAT tenant's env. `/health` never touches the target.
#   · `GET /auth/v1/settings` on api.entrelares.app with the tenant key — the one path that
#     crosses the gateway to the target (key check, key swap, GoTrue answering). Entrelares
#     only: it is the one tenant with clients behind the gateway today; Gestão and Desmalha
#     join the day theirs are (03.4.3, 03.4.4).
# A probe that fails is tried once more after 10 s, so one lost packet is not an incident.
#
# On failure: ONE open issue labelled `monitor` — opened, or commented if already open — with
# the host, the path and the status code. GitHub e-mails the owner for both. When every probe
# is green again, the issue gets a recovery comment and is closed. The run history of this
# workflow is the evidence of card 03.6's "7 days of green /health".
#
# PUBLIC repository, so the log is public: it prints host, path, status and time — never the
# key (a VARIABLE, since it is the tenant's PUBLIC key, and still never echoed) and never a
# response body. `test/unit/monitor.test.ts` reads this file as data and holds all of it.
#
# `drill` (dispatch only) adds one probe that must fail — `/monitor-drill` answers the
# gateway's own `404 unknown_route` — to prove the alert path end to end; the next green
# run closes the issue it opened.

on:
  schedule:
    # Off the top of the hour, where GitHub's scheduler is most loaded.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Provoke one failing probe to test the alert (opens the issue)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY: ${{ vars.FULCRUM_MONITOR_ENTRELARES_KEY }}
      DRILL: ${{ inputs.drill || false }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Probe the production gateways
        run: |
          set -uo pipefail
          : > failures.txt
          # <host> <path> <jq test on the body> [curl header args...]
          probe() {
            local host="$1" path="$2" test="$3"; shift 3
            local code ms attempt
            for attempt in 1 2; do
              read -r code ms < <(curl -s -o body.json --max-time 15 \
                -w '%{http_code} %{time_total}' "$@" "https://$host$path" || true)
              code=${code:-000}
              if [ "$code" = 200 ] && jq -e "$test" body.json > /dev/null 2>&1; then
                echo "OK   $host$path → $code in ${ms}s"
                rm -f body.json
                return 0
              fi
              [ "$attempt" = 1 ] && sleep 10
            done
            rm -f body.json
            echo "::error::FAIL $host$path → $code"
            echo "$host $path $code" >> failures.txt
          }

          probe api.entrelares.app /health '.tenant == "entrelares"'
          probe api.gestaoim360.com /health '.tenant == "gestaoim360"'
          probe api.desmalha.app /health '.tenant == "desmalha"'
          if [ -n "$KEY" ]; then
            probe api.entrelares.app /auth/v1/settings '.external != null' \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          else
            echo "::notice::FULCRUM_MONITOR_ENTRELARES_KEY is not set — the target probe is off"
          fi
          if [ "$DRILL" = true ]; then
            echo "Drill: one probe that must fail"
            probe api.entrelares.app /monitor-drill 'true'
          fi

          [ ! -s failures.txt ]

      - name: Open or comment the monitor issue
        if: failure()
        run: |
          set -euo pipefail
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo "**$now** — probe(s) failing, each after one retry:"
            echo
            if [ -s failures.txt ]; then
              while read -r host path code; do
                echo "- \`$host$path\` → **$code**"
              done < failures.txt
            else
              echo "- the probe step failed without a probe result"
            fi
            echo
            [ "$DRILL" = true ] && echo "_Drill run (\`drill: true\`): the \`/monitor-drill\` failure is provoked on purpose._" && echo
            echo "Run: $RUN_URL · what to do: \`docs/runbook.md\` §Monitor"
          } > issue.md
          gh label create monitor --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description 'Opened by the Monitor workflow (card 08.1)' --force > /dev/null
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label monitor --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label monitor \
              --title "Monitor: production gateway probe failing" --body-file issue.md
          fi

      - name: Close the monitor issue on recovery
        if: success()
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label monitor --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
              --comment "**$(date -u '+%Y-%m-%d %H:%M UTC')** — every probe green again. Run: $RUN_URL"
          fi
