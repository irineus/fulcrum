name: Monitor

# Card 08.1 — the external watch on the three production gateways, in two layers since
# 04/11/2026 (owner):
#
#   · EVERY 5 MINUTES — an external uptime service (UptimeRobot, free plan), outside GitHub
#     and outside Cloudflare: keyword checks on the three `/health` and on
#     `api.entrelares.app/webhooks/public-settings`, the key-exempt route that crosses the
#     gateway to the target. It e-mails the owner. Its monitors and their exact settings are
#     `docs/runbook.md` §Monitor.
#   · ONCE A DAY — this workflow: one pass over the same `/health` plus
#     `GET /auth/v1/settings` with the tenant key, the one check the external service cannot
#     make (it needs the key in two headers), proving the key swap and GoTrue end to end.
#
# WHY NOT EVERY 5 MINUTES HERE ANY MORE. From 28/09 to 04/11/2026 this workflow ran a 5 h 45
# loop that dispatched its successor, so one job was always running: ~1,760 billed minutes a
# day. With the repositories private on 01/11 it spent the account's 2,000 monthly minutes
# by 02/11 12:21 UTC and blocked every workflow of every repository (Entrelares, Gestão,
# Desmalha) until they went public again. A loop that never ends, or a self-dispatch, must
# not come back — `test/unit/monitor.test.ts` holds that.
#
# On failure: ONE open issue labelled `monitor` — opened, or commented if already open — with
# host, path and status code. GitHub e-mails the owner for both. An all-green pass closes it.
# A failed pass ends red.
#
# PUBLIC repository, so the log is public: it prints host, path, status and time — never the
# key and never a response body. The key is the tenant's PUBLIC key, and it is still read
# from a SECRET: GitHub prints every step's `env:` block in the log and masks secrets only,
# never variables — the first drill (28/09/2026) printed it from `vars` that way. No secret →
# the target probe is off and the run says so. `test/unit/monitor.test.ts` reads this file as
# data and holds all of it.
#
# `drill` adds one probe that must fail — `/monitor-drill` answers the gateway's own
# `404 unknown_route` — to prove the alert path end to end; the next green pass closes the
# issue it opened.

on:
  schedule:
    # Once a day, off the top of the hour. GitHub runs this repository's daily crons hours
    # late; for a daily check that is fine — the 5-minute watch is the external service.
    - cron: '41 7 * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Provoke one failing probe to test the alert (opens the issue)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # One pass takes seconds; a hung curl is capped at 15 s per try.
    timeout-minutes: 5
    env:
      KEY: ${{ secrets.FULCRUM_MONITOR_ENTRELARES_KEY }}
      DRILL: ${{ inputs.drill || false }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Probe the production gateways, once
        run: |
          # NO `-e`, on purpose and explicitly: the runner starts bash with `-e`, and a failing
          # probe must be recorded, not end the step before the next host is probed.
          set +e
          set -uo pipefail

          # <host> <path> <jq test on the body> [curl header args...]
          probe() {
            local host="$1" path="$2" test="$3"; shift 3
            local code ms attempt
            for attempt in 1 2; do
              read -r code ms < <(curl -s -o body.json --max-time 15 \
                -w '%{http_code} %{time_total}\n' "$@" "https://$host$path" || true)
              code=${code:-000}
              if [ "$code" = 200 ] && jq -e "$test" body.json > /dev/null 2>&1; then
                echo "OK   $host$path → $code in ${ms}s"
                rm -f body.json
                return 0
              fi
              [ "$attempt" = 1 ] && sleep 10
            done
            rm -f body.json
            echo "::error::FAIL $host$path → $code"
            echo "$host $path $code" >> failures.txt
          }

          open_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --label monitor --state open \
              --json number --jq '.[0].number // empty'
          }

          # One issue per incident: opened, or commented on while it lasts.
          report() {
            {
              echo "**$(date -u '+%Y-%m-%d %H:%M UTC')** — probe(s) failing, each after one retry:"
              echo
              while read -r host path code; do
                echo "- \`$host$path\` → **$code**"
              done < failures.txt
              echo
              if [ "$DRILL" = true ]; then
                echo "_Drill run (\`drill: true\`): the \`/monitor-drill\` failure is provoked on purpose._"
                echo
              fi
              echo "Run: $RUN_URL · what to do: \`docs/runbook.md\` §Monitor"
            } > issue.md
            gh label create monitor --repo "$GITHUB_REPOSITORY" --color B60205 \
              --description 'Opened by the Monitor workflow (card 08.1)' --force > /dev/null
            local open
            open=$(open_issue)
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file issue.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --label monitor \
                --title "Monitor: production gateway probe failing" --body-file issue.md
            fi
          }

          close_if_open() {
            local open
            open=$(open_issue)
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
                --comment "**$(date -u '+%Y-%m-%d %H:%M UTC')** — every probe green again. Run: $RUN_URL"
            fi
          }

          echo "── pass at $(date -u '+%H:%M:%S UTC')"
          : > failures.txt
          probe api.entrelares.app /health '.tenant == "entrelares"'
          probe api.gestaoim360.com /health '.tenant == "gestaoim360"'
          probe api.desmalha.app /health '.tenant == "desmalha"'
          if [ -n "$KEY" ]; then
            probe api.entrelares.app /auth/v1/settings '.external != null' \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          else
            echo "::notice::the secret FULCRUM_MONITOR_ENTRELARES_KEY is not set — the target probe is off"
          fi
          if [ "$DRILL" = true ]; then
            echo "Drill: one probe that must fail"
            probe api.entrelares.app /monitor-drill 'true'
          fi

          if [ -s failures.txt ]; then
            report
            exit 1
          fi
          close_if_open
